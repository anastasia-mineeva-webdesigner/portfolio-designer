name: Check isolated admin
on:
  push:
    paths: ["admin/**", ".github/workflows/admin-check.yml"]
  pull_request:
    paths: ["admin/**", ".github/workflows/admin-check.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
